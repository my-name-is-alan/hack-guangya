[package]
name = "guangya-folder-sync"
version = "0.1.44"
description = "光鸭云盘文件夹同步 Tauri 客户端"
authors = ["hack-guangya"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-updater = "2.10.1"
axum = { version = "0.8", features = ["ws"] }
opendal = { version = "0.57", default-features = false, features = ["services-oss", "reqwest-rustls-tls", "executors-tokio", "layers-retry"] }
notify = "8.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "net", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
encoding_rs = "0.8"
opener = "0.7"
base64 = "0.22"
httpdate = "1"
futures-util = "0.3"
hex = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "local-offset"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
percent-encoding = "2"
regex = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
grammers-client = { version = "0.10", features = ["proxy", "html"] }
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
