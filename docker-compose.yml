services:
  guangya-sync:
    image: ${GUANGYA_IMAGE:-94xhzy/guangya-sync:0.1.15}
    pull_policy: always
    container_name: guangya-sync
    restart: unless-stopped
    ports:
      - "${GUANGYA_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GUANGYA_WEBDAV_PORT:-19090}:19090"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      GUANGYA_WEBDAV_HOST: "0.0.0.0"
      GUANGYA_WEBDAV_PORT: "19090"
      GUANGYA_WEBDAV_PUBLIC_PORT: ${GUANGYA_WEBDAV_PORT:-19090}
      GUANGYA_WEBDAV_ALLOW_NON_LOOPBACK: "1"
      GUANGYA_WEBDAV_USERNAME: ${GUANGYA_WEBDAV_USERNAME:-guangya}
      GUANGYA_WEBDAV_PASSWORD: ${GUANGYA_WEBDAV_PASSWORD:-}
      DATA_DIR: /data
      GUANGYA_ADMIN_USERNAME: ${GUANGYA_ADMIN_USERNAME:-admin}
      GUANGYA_ADMIN_PASSWORD: ${GUANGYA_ADMIN_PASSWORD:?请先在 .env 中设置强随机管理密码}
      GUANGYA_WATCH_ROOT: /watch
      GUANGYA_ARCHIVE_ROOT: /archive
      GUANGYA_FILE_ROOTS: /watch,/archive
      GUANGYA_DEFAULT_MONITOR_MODE: polling
      GUANGYA_UPLOAD_CONCURRENCY: ${GUANGYA_UPLOAD_CONCURRENCY:-2}
      GUANGYA_DOWNLOAD_CONCURRENCY: ${GUANGYA_DOWNLOAD_CONCURRENCY:-2}
      GUANGYA_OSS_TIMEOUT_MS: ${GUANGYA_OSS_TIMEOUT_MS:-600000}
      GUANGYA_OSS_RETRY_MAX: ${GUANGYA_OSS_RETRY_MAX:-3}
      GUANGYA_OSS_PARALLEL: ${GUANGYA_OSS_PARALLEL:-3}
      GUANGYA_CLOUD_CONFIRM_TIMEOUT_MS: ${GUANGYA_CLOUD_CONFIRM_TIMEOUT_MS:-600000}
      GUANGYA_CLOUD_CONFIRM_POLL_MS: ${GUANGYA_CLOUD_CONFIRM_POLL_MS:-1000}
      GUANGYA_AUTO_SHARE_QUIET_MS: ${GUANGYA_AUTO_SHARE_QUIET_MS:-30000}
      GUANGYA_TOKEN_REFRESH_MS: ${GUANGYA_TOKEN_REFRESH_MS:-1200000}
      GUANGYA_FILE_STABILITY_MS: ${GUANGYA_FILE_STABILITY_MS:-1200}
      GUANGYA_FILE_BUSY_RETRY_MS: ${GUANGYA_FILE_BUSY_RETRY_MS:-3000}
      HDHIVE_BASE_URL: ${HDHIVE_BASE_URL:-}
      HDHIVE_GUANGYA_SYNC_SECRET: ${HDHIVE_GUANGYA_SYNC_SECRET:-}
      HDHIVE_GUANGYA_SYNC_INSTANCE_ID: ${HDHIVE_GUANGYA_SYNC_INSTANCE_ID:-}
      HDHIVE_ALLOWED_HOSTS: ${HDHIVE_ALLOWED_HOSTS:-}
      GUANGYA_TOKEN: ${GUANGYA_TOKEN:-}
    volumes:
      - ./docker-data:/data
      - ./watch:/watch
      - ./archive:/archive
